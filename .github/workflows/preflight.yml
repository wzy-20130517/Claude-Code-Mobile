name: Preflight

# 【为什么只做预检，不做完整测试套】
# 项目在 2026-09-18 删掉了整套回归测试（用户：「每次花最多的时间反而查不出东西，
# 一直在修复 test 文件」）。现在的质量门是 **restart-preflight**：
#   · 语法检查（node --check 等价）
#   · 运行期未声明变量（防「语法绿、运行红」的 ReferenceError）
#   · ESM import/export 链接（防 named export 不存在）
# 这三项在手机上跑要 43 秒，CI 上更快，且**零维护**（不需要随代码改动更新断言）。
#
# 【为什么不加更重的检查】
# ZCode 那种 3183 个测试文件的规模，是多人协作 + CI 矩阵撑着的。单人快速迭代的
# 项目里，静态断言测试改一行代码就崩，维护成本远超收益（这是本项目的实战结论）。

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        # 只装预检需要的两个包，不跑完整 npm ci —— 完整依赖含 playwright 等重包，
        # CI 里用不上（会拖慢几分钟）。
        #
        # ⚠️ typescript 必须锁 5.x：7.0+ 是原生 Go 版，npm 包里只有 CLI 二进制，
        # **没有 JS API**（lib/ 只有 4 个文件，`ts.isIdentifier` 之类不存在）。
        # restart-preflight 依赖完整的 AST API，装 7.x 会报「无法加载 AST 静态检查器」
        # （2026-10-11 CI #1 实测）。版本与 devDependencies 里的一致。
        run: |
          npm install --no-save typescript@5.9.3 unbash

      - name: Run preflight
        run: node tools/ci-preflight.mjs

      - name: Check web server syntax
        run: node --check web/server.mjs
